<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff2eb"><title>おもいと｜家族の毎日を、ひとつに。</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#65453d;background:#fff8f3}*{box-sizing:border-box}body{margin:0;padding-bottom:calc(84px + env(safe-area-inset-bottom))}main{max-width:620px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:70px;height:70px;object-fit:contain;border-radius:16px;background:white}.brand h1{margin:0;font-size:25px;color:#a45e57}.brand small{color:#98766c}.pill,.card{background:#fff;border:1px solid #f6e0d4;border-radius:20px;box-shadow:0 2px 8px #dfaa9714}.pill{padding:10px 12px;font-size:12px}.card{padding:16px;margin-bottom:14px}.hello{background:#ffebe3}.title{font-size:19px;font-weight:800;margin:8px 0 14px}.muted{color:#957b70;font-size:13px}.item{border-bottom:1px solid #f7e9e1;padding:12px 0;display:flex;gap:9px;justify-content:space-between;align-items:center}.item:last-child{border-bottom:0}.sub{font-size:12px;color:#a1887e;margin-top:4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:#fff0e9;border:0;border-radius:17px;padding:18px;text-align:left;font-size:16px;color:#80534e;min-height:100px}.tile:nth-child(2){background:#fff4dd}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e6a09a;outline-offset:2px}.primary{background:#d77e77;color:white;border:0;border-radius:14px;padding:12px 16px;font-weight:700}.light{background:#fff2eb;border:1px solid #f1d5cc;color:#a05c57;border-radius:12px;padding:9px 12px}.remove{background:transparent;border:0;color:#b36d67;font-size:13px}.small{font-size:12px;padding:7px 9px}input,textarea,select{width:100%;font:inherit;border:1px solid #e8cfc2;border-radius:12px;padding:12px;background:white;color:#5c4540;margin:6px 0}textarea{min-height:76px}label{font-size:13px;color:#74594f;font-weight:600}.form{margin:12px 0;padding:14px;background:#fff2e9;border-radius:16px}.hidden{display:none!important}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #f0dcd3;display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.tabs-inner{display:flex;max-width:620px;width:100%}.tab{flex:1;border:0;background:transparent;color:#9b8179;font-size:11px;padding:6px 0}.tab span{display:block;font-size:23px;margin-bottom:2px}.tab.active{color:#c26c66;background:#fff0e9;border-radius:12px;font-weight:bold}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:space-between}.check{width:24px;height:24px;accent-color:#d77e77}.done{text-decoration:line-through;opacity:.55}.notice{background:#fff3d9;padding:10px;border-radius:12px;color:#846442;font-size:12px;line-height:1.6;margin:10px 0 18px}.footer{font-size:12px;color:#8b756c;text-align:center;margin:25px 0}.person{display:inline-block;background:#fff0e6;padding:6px 10px;border-radius:999px;margin:3px;font-size:12px}
</style></head><body><main><header><div class="brand"><img src="logo.jpg" alt="おもいと 正式ロゴ"><div><h1>おもいと</h1><small>家族の想いを、ひとつに。</small></div></div><span class="pill">🏠 試作版</span></header><div class="notice">これは1台で試す無料プロトタイプです。保存先はこのブラウザ内のみ。家族間の共有・ログイン・クラウド同期はまだありません。個人情報は入力しないでください。</div><div id="content"></div><p class="footer">🧵 おもいと｜家族の毎日を、ひとつに。</p></main><nav class="tabs"><div class="tabs-inner" id="tabs"></div></nav>
<script>
const KEY='omoito-demo-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{};state ||= {events:[{id:1,title:'学校の行事',date:today(),time:'09:00',person:'子どもA'},{id:2,title:'習い事',date:today(),time:'16:30',person:'子どもB'}],shopping:[{id:3,title:'牛乳',qty:'1本',done:false},{id:4,title:'食パン',qty:'1袋',done:false},{id:5,title:'卵',qty:'1パック',done:true}],tasks:[{id:6,title:'学校の準備',person:'子どもA',date:today(),done:false},{id:7,title:'ゴミ出し',person:'大人A',date:today(),done:false}],notes:[{id:8,title:'明日の持ち物を確認してね！',pinned:true}],members:['大人A','大人B','子どもA','子どもB','子どもC']};let tab='home',adding=false,editing=null;const tabs=[['home','🏠','ホーム'],['events','📅','予定'],['shopping','🛒','買い物'],['tasks','✅','やること'],['notes','📝','メモ']];function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function go(t){tab=t;adding=false;editing=null;render()}function dateText(s){return s?new Date(s+'T00:00:00').toLocaleDateString('ja-JP',{month:'short',day:'numeric',weekday:'short'}):''}function render(){document.getElementById('tabs').innerHTML=tabs.map(([id,ic,lb])=>`<button class="tab ${tab===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${lb}</button>`).join('');let html='';if(tab==='home'){let ev=state.events.filter(x=>x.date===today()).sort((a,b)=>(a.time||'').localeCompare(b.time||''));html=`<section class="card hello"><div class="title">おかえりなさい！ 🌸</div><div>今日も家族の予定をチェックしよう</div></section><section class="card"><div class="row"><strong>📅 今日の予定</strong><button class="remove" onclick="go('events')">すべて見る ›</button></div>${ev.length?ev.slice(0,3).map(x=>`<div class="item"><span>${esc(x.title)}<div class="sub">${esc(x.person)}</div></span><b>${esc(x.time||'終日')}</b></div>`).join(''):'<p class="muted">今日の予定はありません</p>'}</section><div class="two"><button class="tile" onclick="go('shopping')">🛒<br><strong>買い物</strong><div class="sub">残り${state.shopping.filter(x=>!x.done).length}件</div></button><button class="tile" onclick="go('tasks')">✅<br><strong>やること</strong><div class="sub">残り${state.tasks.filter(x=>!x.done).length}件</div></button></div><section class="card" style="margin-top:14px"><div class="row"><strong>📌 大切なメモ</strong><button class="remove" onclick="go('notes')">メモへ ›</button></div>${state.notes.filter(x=>x.pinned).map(x=>`<p>${esc(x.title)}</p>`).join('')||'<p class="muted">固定メモはありません</p>'}</section><button class="light" onclick="go('settings')">⚙️ 家族・設定</button>`}else if(tab==='settings'){html=`<div class="title">⚙️ 家族・設定</div><section class="card"><strong>家族メンバー（テスト表示）</strong><p>${state.members.map(x=>`<span class="person">👤 ${esc(x)}</span>`).join('')}</p><p class="muted">招待・権限管理・認証は未実装です。</p></section><section class="card"><strong>試作データのリセット</strong><p class="muted">このブラウザに保存された試作データだけを消します。</p><button class="light" onclick="reset()">試作データを初期化</button></section><button class="light" onclick="go('home')">← ホームに戻る</button>`}else{const labels={events:'📅 家族の予定',shopping:'🛒 買い物リスト',tasks:'✅ やること',notes:'📝 家族メモ'};html=`<div class="row"><div class="title">${labels[tab]}</div><button class="primary" onclick="startAdd()">＋ 追加</button></div>${adding?formHTML():''}<section class="card">${listHTML()}</section>`}document.getElementById('content').innerHTML=html}function startAdd(){editing=null;adding=!adding;render()}function formHTML(){let data=editing!=null?(state[tab].find(x=>x.id===editing)||{}):{},item=`<label>${tab==='events'?'予定名':tab==='shopping'?'商品名':tab==='tasks'?'やること':'メモ内容'}</label><input name="title" required maxlength="120" value="${esc(data.title||'')}" placeholder="入力してください">`;if(tab==='events')item+=`<label>日付</label><input name="date" type="date" required value="${esc(data.date||today())}"><label>時間（空欄なら終日）</label><input name="time" type="time" value="${esc(data.time||'')}"><label>対象者</label>${personSelect(data.person)}`;if(tab==='shopping')item+=`<label>数量</label><input name="qty" maxlength="30" value="${esc(data.qty||'')}" placeholder="例：1個">`;if(tab==='tasks')item+=`<label>期限</label><input name="date" type="date" value="${esc(data.date||today())}"><label>担当者</label>${personSelect(data.person)}`;if(tab==='notes')item+=`<label><input style="width:auto" type="checkbox" name="pinned" ${data.pinned?'checked':''}> ホームに固定する</label>`;return `<form class="form" onsubmit="submitItem(event)">${item}<div class="row"><button class="primary" type="submit">${editing!=null?'変更を保存':'追加する'}</button><button class="light" type="button" onclick="cancelForm()">キャンセル</button></div></form>`}function personSelect(v){return `<select name="person"><option value="家族全員" ${v==='家族全員'?'selected':''}>家族全員</option>${state.members.map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`}function listHTML(){let items=[...state[tab]];if(tab==='events')items.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));if(tab==='notes')items.sort((a,b)=>Number(b.pinned)-Number(a.pinned));if(!items.length)return '<p class="muted">まだ登録がありません。「追加」から登録してね。</p>';return items.map(x=>`<div class="item"><div style="flex:1;min-width:0">${['shopping','tasks'].includes(tab)?`<label style="display:flex;align-items:center;gap:10px"><input class="check" style="width:24px;margin:0" type="checkbox" ${x.done?'checked':''} onchange="toggle(${x.id})"><span class="${x.done?'done':''}">${esc(x.title)}</span></label>`:`<strong>${tab==='notes'&&x.pinned?'📌 ':''}${esc(x.title)}</strong>`}<div class="sub">${tab==='events'?`${dateText(x.date)} ${esc(x.time||'終日')} · ${esc(x.person)}`:tab==='tasks'?`${dateText(x.date)} · ${esc(x.person)}`:tab==='shopping'?esc(x.qty||'数量未設定'):'家族メモ'}</div></div><div><button class="light small" onclick="editItem(${x.id})">編集</button> <button class="remove" onclick="deleteItem(${x.id})">削除</button></div></div>`).join('')}function submitItem(e){e.preventDefault();const fd=new FormData(e.target),title=String(fd.get('title')||'').trim();if(!title){alert('内容を入力してね');return}let obj={title};if(tab==='events')Object.assign(obj,{date:fd.get('date'),time:fd.get('time'),person:fd.get('person')});if(tab==='shopping')obj.qty=String(fd.get('qty')||'');if(tab==='tasks')Object.assign(obj,{date:fd.get('date'),person:fd.get('person')});if(tab==='notes')obj.pinned=fd.get('pinned')==='on';if(editing!=null){let old=state[tab].find(x=>x.id===editing);Object.assign(old,obj)}else state[tab].push({id:Date.now(),done:false,...obj});save();adding=false;editing=null;render()}function toggle(id){let item=state[tab].find(x=>x.id===id);if(item){item.done=!item.done;save();render()}}function editItem(id){editing=id;adding=true;render();document.querySelector('.form')?.scrollIntoView({behavior:'smooth',block:'start'})}function cancelForm(){adding=false;editing=null;render()}function deleteItem(id){if(!confirm('この項目を削除しますか？'))return;state[tab]=state[tab].filter(x=>x.id!==id);save();render()}function reset(){if(confirm('この端末の試作データをすべて消しますか？')){localStorage.removeItem(KEY);location.reload()}}render();
</script></body></html>
