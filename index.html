// 繰り返し予定はFirestoreに1件だけ保存し、表示時に日付を展開する。
function repeatLabel(event){return ({weekly:'毎週',monthly:'毎月',daily:'毎日'})[event.repeat]||''}
function eventOccursOn(event,date){
 if(!event||typeof event.date!=='string'||typeof date!=='string')return false;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(event.date)||!/^\d{4}-\d{2}-\d{2}$/.test(date))return false;
 if(date===event.date)return true;
 if(!event.repeat||date<event.date||(event.repeatUntil&&date>event.repeatUntil))return false;
 const start=Date.parse(event.date+'T00:00:00Z'),target=Date.parse(date+'T00:00:00Z');
 if(!Number.isFinite(start)||!Number.isFinite(target))return false;
 const days=(target-start)/86400000;
 if(event.repeat==='daily')return days>0&&Number.isInteger(days);
 if(event.repeat==='weekly')return days>0&&Number.isInteger(days)&&days%7===0;
 if(event.repeat==='monthly')return date.slice(8)===event.date.slice(8)&&date.slice(0,7)>event.date.slice(0,7);
 return false;
}
function eventsOn(date,filter=false){return state.events.filter(e=>eventOccursOn(e,date)&&(!filter||visibleEvent(e))).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}
function repeatInfo(event){const label=repeatLabel(event);return label?' 🔁 '+label+(event.repeatUntil?'（'+dateText(event.repeatUntil)+'まで）':''):''}
function shiftsOn(date,filtered=true){return state.shifts.filter(x=>x.date===date&&(!filtered||visibleEvent(x))).sort((a,b)=>a.start.localeCompare(b.start))}
function shiftEditor(item=null){const x=item||{},members=state.members;return `<form class="form" onsubmit="submitShift(event)"><strong>${item?'🕒 シフトを変更':'🕒 シフトを追加'}</strong><label>日付</label><input type="date" name="date" required value="${esc(x.date||selectedCalendarDate||today())}"><label>担当者</label><select name="person" required>${members.map(m=>`<option value="${esc(m)}" ${m===(x.person||members[0])?'selected':''}>${esc(m)}</option>`).join('')}</select><div class="shift-row"><div><label>開始</label><input type="time" name="start" required value="${esc(x.start||'09:00')}"></div><div><label>終了</label><input type="time" name="end" required value="${esc(x.end||'17:30')}"></div></div><label>メモ（任意）</label><input name="note" maxlength="120" value="${esc(x.note||'')}" placeholder="例：早番・休憩60分"><p class="muted">※ 日付をまたぐ夜勤は、終了時刻を開始時刻より前に設定できます。</p><div class="row"><button type="submit" class="primary">${item?'変更を保存':'シフトを登録'}</button><button type="button" class="light" onclick="cancelShift()">キャンセル</button></div></form>`}
function shiftPage(){const list=[...state.shifts].sort((a,b)=>b.date.localeCompare(a.date)||a.start.localeCompare(b.start));return `<div class="row"><div class="title">🕒 家族のシフト</div><button class="primary" onclick="startShift()">＋ 追加</button></div><p class="muted">勤務時間を登録すると、予定カレンダーにも表示され、家族全員に同期されます。</p>${adding?shiftEditor(editing!=null?state.shifts.find(x=>String(x.id)===String(editing)):null):''}<section class="card">${list.length?list.map(x=>`<div class="item"><div style="flex:1;min-width:0"><div class="shift-label">${colorTag(x.person)}<b>${esc(x.person)}</b></div><div class="sub">${esc(dateText(x.date))}　<span class="shift-time">${esc(x.start)}〜${esc(x.end)}</span></div>${x.note?`<div class="sub shift-note">${esc(x.note)}</div>`:''}</div><div><button class="light small" onclick="editShift('${String(x.id).replace(/[^0-9a-zA-Z_-]/g,'')}')">編集</button><button class="remove" onclick="removeShift('${String(x.id).replace(/[^0-9a-zA-Z_-]/g,'')}')">削除</button></div></div>`).join(''):'<p class="muted">シフトはまだありません。「＋追加」から登録してね。</p>'}</section>`}
function startShift(date){tab='shifts';editing=null;adding=true;if(date)selectedCalendarDate=date;render();resetViewToTop()}
function editShift(id){const x=state.shifts.find(x=>String(x.id)===String(id));if(!x)return;tab='shifts';editing=x.id;adding=true;render();document.querySelector('.form')?.scrollIntoView({block:'start'})}
function cancelShift(){adding=false;editing=null;render()}
function submitShift(e){e.preventDefault();if(!ready){alert('クラウドの接続を確認してね');return}const f=new FormData(e.target),date=String(f.get('date')||''),person=String(f.get('person')||''),start=String(f.get('start')||''),end=String(f.get('end')||''),note=String(f.get('note')||'').trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(end)||!state.members.includes(person)){alert('日付・担当者・時間を確認してね');return}if(start===end){alert('開始と終了の時刻を変えてね');return}if(editing!=null){const x=state.shifts.find(x=>String(x.id)===String(editing));if(!x)return;Object.assign(x,{date,person,start,end,note})}else state.shifts.push({id:Date.now(),date,person,start,end,note});save();adding=false;editing=null;render()}
function removeShift(id){if(!ready)return;const x=state.shifts.find(x=>String(x.id)===String(id));if(!x||!confirm(`${x.person}の${dateText(x.date)}のシフトを削除しますか？`))return;state.shifts=state.shifts.filter(y=>String(y.id)!==String(id));save();render()}
function calendarHTML(){const [year,month]=calendarMonth.split('-').map(Number);const start=new Date(year,month-1,1).getDay(),days=new Date(year,month,0).getDate();const eventMap=new Map();for(let day=1;day<=days;day++){const date=dateKey(year,month,day);eventMap.set(date,eventsOn(date,true))}const week=['日','月','火','水','木','金','土'];let cells=week.map(d=>`<div class="calendar-week">${d}</div>`).join('');for(let i=0;i<Math.ceil((start+days)/7)*7;i++){const n=i-start+1;if(n<1||n>days){cells+='<div aria-hidden="true"></div>';continue}const date=dateKey(year,month,n),dayEvents=eventMap.get(date)||[],dayShifts=shiftsOn(date),count=dayEvents.length+dayShifts.length,classes=[date===today()?'today':'',date===selectedCalendarDate?'selected':''].filter(Boolean).join(' ');cells+=`<button type="button" class="calendar-day ${classes}" aria-label="${month}月${n}日 ${count}件の予定" aria-pressed="${date===selectedCalendarDate}" onclick="selectCalendarDay('${date}')"><span class="calendar-num">${n}</span>${count?`<span class="calendar-labels">${dayEvents.slice(0,2).map(e=>`<span class="calendar-event-label" style="--event-color:${memberColor(e.person)};--event-bg:${memberColor(e.person)}24" title="${esc(e.title)}">${esc(e.title)}</span>`).join('')}${dayShifts.slice(0,Math.max(0,2-dayEvents.length)).map(x=>`<span class="calendar-shift-label">🕒 ${esc(x.person)} ${esc(x.start)}〜${esc(x.end)}</span>`).join('')}${count>2?`<span class="calendar-event-more">＋${count-2}件</span>`:''}</span>`:''}</button>`}const items=eventsOn(selectedCalendarDate,true),selectedShifts=shiftsOn(selectedCalendarDate);return `<section class="card"><div class="calendar-head"><strong>📅 ${year}年${month}月</strong><div class="calendar-nav"><button class="light small" onclick="moveCalendarMonth(-1)" aria-label="前の月">‹</button><button class="light small" onclick="calendarToday()">今日</button><button class="light small" onclick="moveCalendarMonth(1)" aria-label="次の月">›</button></div></div><div class="calendar-filter"><label for="calendarPersonFilter">👨‍👩‍👧‍👦 表示する家族</label><select id="calendarPersonFilter" onchange="setCalendarFilter(this.value)"><option value="家族全員" ${calendarFilter==='家族全員'?'selected':''}>全員の予定</option>${state.members.map(n=>`<option value="${esc(n)}" ${calendarFilter===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="calendar-legend">${state.members.map(n=>`<span>${colorTag(n)}${esc(n)}</span>`).join('')}<span>${colorTag('家族全員')}家族全員</span></div><div class="calendar-grid">${cells}</div><div class="calendar-agenda"><h3>📌 ${esc(dateText(selectedCalendarDate))}の予定（${items.length}件）</h3>${items.length?items.map(x=>`<div class="item"><div style="min-width:0;flex:1"><strong>${colorTag(x.person)}${esc(x.title)}</strong><div class="sub">${esc(x.person||'家族全員')} · ${esc(x.time||'終日')}${repeatInfo(x)}</div></div><button class="light small" onclick="editCalendarItem('${String(x.id).replace(/[^0-9a-zA-Z_-]/g,'')}')">編集</button></div>`).join(''):'<p class="muted">この日の予定はありません</p>'}${selectedShifts.length?`<div class="sub">🕒 この日のシフト（${selectedShifts.length}件）</div>${selectedShifts.map(x=>`<div class="item"><div style="flex:1">${colorTag(x.person)}${esc(x.person)}　${esc(x.start)}〜${esc(x.end)}</div><button class="light small" onclick="editShift('${String(x.id).replace(/[^0-9a-zA-Z_-]/g,'')}')">編集</button></div>`).join('')}`:''}<div class="row"><button class="light calendar-action" onclick="addCalendarEvent()">＋ 予定</button><button class="light calendar-action" onclick="startShift(selectedCalendarDate)">＋ シフト</button></div></div></section>`}
function addCalendarEvent(){tab='events';editing=null;adding=true;render();document.querySelector('.form')?.scrollIntoView({behavior:'smooth',block:'start'})}
function editCalendarItem(id){const item=state.events.find(x=>String(x.id)===String(id));if(!item)return;tab='events';editing=item.id;adding=true;render();document.querySelector('.form')?.scrollIntoView({behavior:'smooth',block:'start'})}
function render(){document.getElementById('tabs').innerHTML=tabs.map(([id,ic,lb])=>`<button class="tab ${tab===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${lb}</button>`).join('');let html='';if(tab==='home'){let ev=eventsOn(today());let due=state.tasks.filter(x=>!x.done&&(!x.date||x.date<=today())).sort((a,b)=>(a.date||'9999-12-31').localeCompare(b.date||'9999-12-31'));let shoppingPending=state.shopping.filter(x=>!x.done);html=`<section class="card home-card"><div class="row"><strong>📅 今日の予定</strong><button class="remove" onclick="go('events')">すべて見る ›</button></div>${ev.length?ev.slice(0,3).map(x=>`<div class="item"><div class="home-ev-main">${colorTag(x.person)}<span class="home-ev-title">${esc(x.title)}</span><span class="home-ev-person">${esc(x.person||'家族全員')}</span></div><b class="home-ev-time">${esc(x.time||'終日')}</b></div>`).join(''):'<p class="muted">今日の予定はありません</p>'}${ev.length>3?`<p class="muted">ほか${ev.length-3}件の予定があります</p>`:''}</section><section class="card home-card"><div class="row"><strong>✅ 今日のやること</strong><button class="remove" onclick="go('tasks')">すべて見る ›</button></div>${due.length?due.slice(0,2).map(x=>`<div class="item"><label class="home-task-label"><input type="checkbox" onchange="toggleHomeTask('${String(x.id).replace(/[^0-9a-zA-Z_-]/g,'')}')" aria-label="${esc(x.title)}を完了にする"><span>${esc(x.title)}<span class="sub" style="display:block">${esc(x.person||'家族全員')}${x.date&&x.date<today()?` <span class="task-overdue">・期限超過（${esc(dateText(x.date))}）</span>`:''}</span></span></label></div>`).join(''):'<p class="muted">今日のやることはありません</p>'}${due.length>2?`<p class="muted">ほか${due.length-2}件あります</p>`:''}</section><section class="card home-card home-shopping-card"><div class="row"><strong>🛒 買い物リスト</strong><button class="remove" onclick="go('shopping')">すべて見る ›</button></div>${shoppingPending.length?shoppingPending.slice(0,3).map(x=>`<div class="item"><label class="home-shopping-label"><input type="checkbox" onchange="toggleHomeShopping('${String(x.id).replace(/[^0-9a-zA-Z_-]/g,'')}')" aria-label="${esc(x.title)}を購入済みにする"><span class="home-shopping-info"><span class="home-shopping-name">${esc(x.title)}</span>${x.qty?`<span class="home-shopping-qty">${esc(x.qty)}</span>`:''}</span></label></div>`).join(''):'<p class="muted">買い物はありません</p>'}${shoppingPending.length>3?`<p class="muted">ほか${shoppingPending.length-3}件あります</p>`:''}</section><button class="home-note-link" onclick="go('notes')">📝 メモ　<span class="sub">${state.notes.length}件　›</span></button>${state.notes.some(x=>x.pinned)?`<section class="card home-card home-secondary"><div class="row"><strong>📌 大切なメモ</strong><button class="remove" onclick="go('notes')">メモへ ›</button></div>${state.notes.filter(x=>x.pinned).slice(0,2).map(x=>`<p>${esc(x.title)}</p>`).join('')}</section>`:''}<button class="light" onclick="go('settings')">⚙️ 家族・設定</button>`}else if(tab==='shifts'){html=shiftPage()}else if(tab==='settings'){html=`<div class="title">⚙️ 家族・設定</div><section class="card"><div class="row"><strong>👨‍👩‍👧‍👦 家族メンバー</strong><span class="muted">${state.members.length}人</span></div><p class="muted">家族ごとの色を選べます。名前と色は全員に同期され、予定カレンダーにも反映されます。</p><form class="form" onsubmit="addMember(event)"><label for="memberName">新しいメンバーの名前</label><input id="memberName" name="memberName" maxlength="30" required placeholder="例：お父さん"><button class="primary" type="submit">＋ メンバーを追加</button></form>${state.members.map((x,i)=>`<div class="item"><span class="member-name">${colorTag(x)}👤 ${esc(x)}</span><div class="member-actions">${colorSelect(i,x)}<button class="light small" onclick="renameMember(${i})">名前変更</button><button class="remove" onclick="removeMember(${i})">削除</button></div></div>`).join('')}<p class="muted">※ ここでのメンバー設定は表示名の管理です。ログインアカウントや個別の閲覧権限は作りません。</p></section><section class="card"><strong>💾 バックアップ・復元</strong><p class="muted">家族の予定・シフト・買い物・やること・メモ・メンバー名・色設定をJSONファイルに保存できます。ファイルには家族の情報が入るため、共有や保管に注意してください。</p><div class="row"><button class="primary" onclick="downloadBackup()">⬇️ バックアップを保存</button><span class="muted">通信中は操作できません</span></div><div class="form"><strong>📂 バックアップから復元</strong><p class="muted">復元すると現在の家族全員のデータが置き換わります。先に必ず最新のバックアップを保存してください。</p><label for="backupFile">バックアップファイル（.json）</label><input id="backupFile" type="file" accept=".json,application/json" onchange="readBackupFile(event)"><div id="restorePreview" class="muted" role="status">ファイルを選ぶと内容を確認できます。</div><label style="display:flex;align-items:center;gap:8px;margin-top:12px"><input id="restoreSafety" type="checkbox" style="width:auto" onchange="updateRestoreButton()">最新データのバックアップを保存済みです</label><button id="restoreButton" class="light" type="button" onclick="restoreBackup()" disabled>復元する（現在の共有データを置換）</button></div></section><section class="card"><strong>共有データの保護</strong><p class="muted">共有データの一括削除は安全のため無効です。</p><button class="light" onclick="reset()">初期化は無効</button></section><section class="card"><div class="row"><strong>🔐 アカウント</strong><button class="light small" onclick="logout()">ログアウト</button></div><p class="muted">家族用アカウントからログアウトします。保存済みの共有データは削除されません。</p></section><button class="light" onclick="go('home')">← ホームに戻る</button>`}else{const labels={events:'📅 家族の予定',shopping:'🛒 買い物リスト',tasks:'✅ やること',notes:'📝 家族メモ'};html=`<div class="row"><div class="title">${labels[tab]}</div><button class="primary" onclick="startAdd()">＋ 追加</button></div>${adding?formHTML():''}${tab==='events'?calendarHTML()+'<div class="calendar-list-label"><strong>📋 予定の一覧</strong><span class="muted">すべての予定</span></div>':''}<section class="card">${listHTML()}</section>`}document.getElementById('content').innerHTML=html}function startAdd(){editing=null;adding=!adding;render()}function formHTML(){let data=editing!=null?(state[tab].find(x=>x.id===editing)||{}):{},item=`<label>${tab==='events'?'予定名':tab==='shopping'?'商品名':tab==='tasks'?'やること':'メモ内容'}</label><input name="title" required maxlength="120" value="${esc(data.title||'')}" placeholder="入力してください">`;if(tab==='events')item+=`<label>日付</label><input name="date" type="date" required value="${esc(data.date||(tab==='events'?selectedCalendarDate:today()))}"><label>時間（空欄なら終日）</label><input name="time" type="time" value="${esc(data.time||'')}"><label>対象者</label>${personSelect(data.person)}<label for="eventRepeat">繰り返し</label><select id="eventRepeat" name="repeat" onchange="toggleRepeatUntil(this.value)"><option value="" ${!data.repeat?'selected':''}>繰り返さない</option><option value="daily" ${data.repeat==='daily'?'selected':''}>毎日</option><option value="weekly" ${data.repeat==='weekly'?'selected':''}>毎週（同じ曜日）</option><option value="monthly" ${data.repeat==='monthly'?'selected':''}>毎月（同じ日）</option></select><div id="repeatUntilBlock" class="${data.repeat?'':'hidden'}"><label>繰り返し終了日（任意）</label><input name="repeatUntil" type="date" value="${esc(data.repeatUntil||'')}"><p class="muted">終了日を空欄にすると繰り返し続けます。毎月29〜31日は、その日が存在しない月には表示されません。</p></div>${data.repeat?'<p class="notice">🔁 繰り返し予定の編集・削除は、シリーズ全体に適用されます。</p>':''}`;if(tab==='shopping')item+=`<label>数量</label><input name="qty" maxlength="30" value="${esc(data.qty||'')}" placeholder="例：1個">`;if(tab==='tasks')item+=`<label>期限</label><input name="date" type="date" value="${esc(data.date||today())}"><label>担当者</label>${personSelect(data.person)}`;if(tab==='notes')item+=`<label><input style="width:auto" type="checkbox" name="pinned" ${data.pinned?'checked':''}> ホームに固定する</label>`;return `<form class="form" onsubmit="submitItem(event)">${item}<div class="row"><button class="primary" type="submit">${editing!=null?'変更を保存':'追加する'}</button><button class="light" type="button" onclick="cancelForm()">キャンセル</button></div></form>`}function toggleRepeatUntil(value){document.getElementById('repeatUntilBlock')?.classList.toggle('hidden',!value)}function personSelect(v){return `<select name="person"><option value="家族全員" ${v==='家族全員'?'selected':''}>家族全員</option>${state.members.map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`}function listHTML(){let items=[...state[tab]];if(tab==='events'){const now=today();items.sort((a,b)=>{const ad=String(a.date||''),bd=String(b.date||'');const af=ad>=now,bf=bd>=now;if(af!==bf)return af?-1:1;return af?(ad+String(a.time||'')).localeCompare(bd+String(b.time||'')):(bd+String(b.time||'')).localeCompare(ad+String(a.time||''));});}if(tab==='notes')items.sort((a,b)=>Number(b.pinned)-Number(a.pinned));if(!items.length)return '<p class="muted">まだ登録がありません。「追加」から登録してね。</p>';const eventTotal=tab==='events'?items.length:0;if(tab==='events'&&!showAllEvents)items=items.slice(0,5);return items.map(x=>`<div class="item"><div style="flex:1;min-width:0">${['shopping','tasks'].includes(tab)?`<label style="display:flex;align-items:center;gap:10px"><input class="check" style="width:24px;margin:0" type="checkbox" ${x.done?'checked':''} onchange="toggle(${x.id})"><span class="${x.done?'done':''}">${esc(x.title)}</span></label>`:`<strong>${tab==='events'?colorTag(x.person):''}${tab==='notes'&&x.pinned?'📌 ':''}${esc(x.title)}</strong>`}<div class="sub">${tab==='events'?`${dateText(x.date)} ${esc(x.time||'終日')} · ${esc(x.person)}${repeatInfo(x)}`:tab==='tasks'?`${dateText(x.date)} · ${esc(x.person)}`:tab==='shopping'?esc(x.qty||'数量未設定'):'家族メモ'}</div></div><div><button class="light small" onclick="editItem(${x.id})">編集</button> <button class="remove" onclick="deleteItem(${x.id})">削除</button></div></div>`).join('')+(tab==='events'&&eventTotal>5?`<button class="light events-show-more" onclick="toggleEventsList()">${showAllEvents?'直近5件に戻す':`すべて表示（全${eventTotal}件）`}</button>`:'')}function toggleEventsList(){showAllEvents=!showAllEvents;render()}function submitItem(e){e.preventDefault();if(!ready){alert("クラウド同期が接続されていません");return}const fd=new FormData(e.target),title=String(fd.get('title')||'').trim();if(!title){alert('内容を入力してね');return}let obj={title};if(tab==='events'){
 const date=String(fd.get('date')||''),repeat=String(fd.get('repeat')||''),until=String(fd.get('repeatUntil')||'');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('開始日を確認してね');return}
 if(repeat&&!['daily','weekly','monthly'].includes(repeat)){alert('繰り返し設定を確認してね');return}
 if(repeat&&until&&until<date){alert('繰り返し終了日は開始日以降にしてね');return}
 Object.assign(obj,{date,time:fd.get('time'),person:fd.get('person'),repeat:repeat||'',repeatUntil:repeat?until:''});
 }if(tab==='shopping')obj.qty=String(fd.get('qty')||'');if(tab==='tasks')Object.assign(obj,{date:fd.get('date'),person:fd.get('person')});if(tab==='notes')obj.pinned=fd.get('pinned')==='on';if(editing!=null){let old=state[tab].find(x=>x.id===editing);Object.assign(old,obj)}else state[tab].push({id:Date.now(),done:false,...obj});save();adding=false;editing=null;render()}function toggleHomeShopping(id){if(!ready)return;const item=state.shopping.find(x=>String(x.id)===String(id));if(item&&!item.done){item.done=true;save();render()}}
function toggleHomeTask(id){if(!ready)return;const item=state.tasks.find(x=>String(x.id)===String(id));if(item&&!item.done){item.done=true;save();render()}}
function toggle(id){if(!ready)return;let item=state[tab].find(x=>x.id===id);if(item){item.done=!item.done;save();render()}}function editItem(id){editing=id;adding=true;render();document.querySelector('.form')?.scrollIntoView({behavior:'smooth',block:'start'})}function cancelForm(){adding=false;editing=null;render()}function deleteItem(id){if(!ready)return;const target=state[tab].find(x=>x.id===id);if(!target)return;if(!confirm(tab==='events'&&target.repeat?'この繰り返し予定をすべて削除しますか？':'この項目を削除しますか？'))return;const removed=target;if(!removed)return;deletedItem={tab,item:{...removed}};state[tab]=state[tab].filter(x=>x.id!==id);save();render();document.getElementById('undoToast').classList.remove('hidden')}function undoDelete(){if(!ready)return;if(!deletedItem)return;const {tab:target,item}=deletedItem;if(!state[target].some(x=>x.id===item.id)){state[target].push(item);save()}deletedItem=null;document.getElementById('undoToast').classList.add('hidden');render()}function cleanMemberName(value){return String(value??'').trim().replace(/\s+/g,' ').slice(0,30)}
function addMember(e){e.preventDefault();if(!ready){alert('クラウド同期に接続されていません');return}const inp=e.target.elements.memberName;const name=cleanMemberName(inp.value);if(!name){alert('名前を入力してね');return}if(name==='家族全員'||state.members.includes(name)){alert('その名前はすでに使われています');return}if(state.members.length>=30){alert('メンバーは30人まで登録できます');return}state.members.push(name);save();render()}
function renameMember(index){if(!ready)return;const old=state.members[index];if(typeof old!=='string')return;const entered=prompt('新しい名前を入力してください',old);if(entered===null)return;const name=cleanMemberName(entered);if(!name){alert('名前を入力してね');return}if(name==='家族全員'||state.members.some((x,i)=>i!==index&&x===name)){alert('その名前はすでに使われています');return}if(name===old)return;state.members[index]=name;if(state.memberColors&&Object.prototype.hasOwnProperty.call(state.memberColors,old)){state.memberColors[name]=state.memberColors[old];delete state.memberColors[old]}if(calendarFilter===old)calendarFilter=name;for(const kind of ['events','tasks','shifts'])for(const item of state[kind])if(item.person===old)item.person=name;save();render()}
function removeMember(index){if(!ready)return;const name=state.members[index];if(typeof name!=='string')return;if(state.members.length<=1){alert('最後の1人は削除できません');return}const used=state.events.filter(x=>x.person===name).length+state.tasks.filter(x=>x.person===name).length+state.shifts.filter(x=>x.person===name).length;const message='「'+name+'」をメンバー一覧から削除しますか？'+(used?'\n関連する予定・やること '+used+' 件の対象者を「家族全員」に変更します。予定やタスク自体は削除しません。':'');if(!confirm(message))return;state.members.splice(index,1);delete state.memberColors[name];if(calendarFilter===name)calendarFilter='家族全員';for(const kind of ['events','tasks','shifts'])for(const item of state[kind])if(item.person===name)item.person='家族全員';save();render()}
// バックアップ・復元：読み込み済みデータはサーバーから最新を再取得する
let restoreCandidate=null,restoreBusy=false;
const dataKeys=['events','shifts','shopping','tasks','notes','members'];
function backupCounts(data){return '予定 '+data.events.length+'件・買い物 '+data.shopping.length+'件・やること '+data.tasks.length+'件・メモ '+data.notes.length+'件・メンバー '+data.members.length+'人・シフト '+(data.shifts?.length??0)+'件'}
function resetRestoreForm(){restoreCandidate=null;const f=document.getElementById('backupFile');if(f)f.value='';const c=document.getElementById('restoreSafety');if(c)c.checked=false;const p=document.getElementById('restorePreview');if(p)p.textContent='ファイルを選ぶと内容を確認できます。';updateRestoreButton()}
function updateRestoreButton(){const b=document.getElementById('restoreButton'),c=document.getElementById('restoreSafety');if(b)b.disabled=!ready||restoreBusy||!restoreCandidate||!c?.checked}
async function getFreshData(){if(!ready||!docRef||!auth.currentUser)throw Error('ログイン・同期接続を確認してください');const snap=await docRef.get({source:'server'});if(!snap.exists) return emptyState();return normalizeState(snap.data())}
function offerJson(data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='omoito_backup_'+new Date().toLocaleDateString('sv-SE')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function downloadBackup(){if(restoreBusy)return;try{const current=await getFreshData();const backup={format:'omoito-family-backup',version:1,exportedAt:new Date().toISOString(),familyId:FAMILY_ID,data:{...Object.fromEntries(dataKeys.map(k=>[k,current[k]])),memberColors:current.memberColors||{}}};offerJson(backup);alert('バックアップファイルを保存しました。iPhoneの「ファイル」アプリで保存先とファイルを確認してください。')}catch(e){alert('バックアップできませんでした。ネットワークと同期状態を確認してください。\n'+e.message)}}
function validateBackup(payload){if(!payload||payload.format!=='omoito-family-backup'||payload.version!==1||payload.familyId!==FAMILY_ID)throw Error('おもいとのこの家族用のバックアップではありません');const d=payload.data;if(!d||typeof d!=='object'||Array.isArray(d))throw Error('データ形式が不正です');for(const k of dataKeys)if(!Array.isArray(d[k])&&!(k==='shifts'&&d[k]===undefined))throw Error(k+'のデータがありません');if(d.members.length<1||d.members.length>30||d.members.some(x=>typeof x!=='string'||!x.trim()||x.length>30)||new Set(d.members).size!==d.members.length)throw Error('メンバー情報が不正です');for(const k of ['events','shopping','tasks','notes','shifts']){if((d[k]||[]).length>10000)throw Error('件数が多すぎます');const ids=new Set();for(const x of (d[k]||[])){if(!x||typeof x!=='object'||Array.isArray(x)||!['string','number'].includes(typeof x.id)||(k!=='shifts'&&(typeof x.title!=='string'||!x.title.trim()||x.title.length>120)))throw Error(k+'に不正な項目があります');if(ids.has(String(x.id)))throw Error(k+'に重複したIDがあります');ids.add(String(x.id));if(k==='shifts'&&(!/^\d{4}-\d{2}-\d{2}$/.test(x.date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(x.start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(x.end)||typeof x.person!=='string'))throw Error('シフトの形式が不正です');for(const [key,value] of Object.entries(x)){if(key==='id'||key==='title')continue;if(!['string','number','boolean'].includes(typeof value)||typeof value==='string'&&value.length>1000)throw Error(k+'の値が不正です')}}}const restored=Object.fromEntries(dataKeys.map(k=>[k,JSON.parse(JSON.stringify(d[k]||[]))]));restored.memberColors={};if(d.memberColors!==undefined){if(!d.memberColors||typeof d.memberColors!=='object'||Array.isArray(d.memberColors))throw Error('色設定が不正です');for(const [name,color] of Object.entries(d.memberColors)){if(!d.members.includes(name)||!COLOR_PALETTE.includes(color))throw Error('色設定が不正です');restored.memberColors[name]=color}}return restored}
async function readBackupFile(e){restoreCandidate=null;updateRestoreButton();const file=e.target.files?.[0],preview=document.getElementById('restorePreview');if(!file){preview.textContent='ファイルが選ばれていません';return}try{if(file.size>2*1024*1024)throw Error('2MB以下のバックアップを選んでください');const parsed=JSON.parse(await file.text());restoreCandidate=validateBackup(parsed);if(parsed.data.shifts===undefined){restoreCandidate.shifts=null;}preview.textContent='復元予定：'+backupCounts(restoreCandidate)+'。保存日時：'+(parsed.exportedAt?new Date(parsed.exportedAt).toLocaleString('ja-JP'):'不明')+'。現在のデータは復元時に置き換わります。';updateRestoreButton()}catch(err){restoreCandidate=null;preview.textContent='読み込み不可：'+err.message;updateRestoreButton()}}
async function restoreBackup(){if(restoreBusy||!restoreCandidate||!ready||!document.getElementById('restoreSafety')?.checked)return;const candidate=restoreCandidate;const answer=prompt('復元すると家族全員の現在のデータが置き換わります。\n'+backupCounts(candidate)+'\n実行する場合は「復元」と入力してください');if(answer!=='復元')return;if(!confirm('最終確認：現在の共有データをバックアップファイルの内容に置き換えます。よろしいですか？'))return;restoreBusy=true;updateRestoreButton();try{await getFreshData();await docRef.set({...candidate,shifts:candidate.shifts===null?(await getFreshData()).shifts:candidate.shifts,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});statusText('☁️ 復元完了・同期中…');resetRestoreForm();alert('復元を書き込みました。家族の端末にも同期されます。')}catch(e){alert('復元に失敗しました。最新状態を確認してください。\n'+e.message)}finally{restoreBusy=false;updateRestoreButton()}}
function reset(){alert('共有データを誤って削除しないよう、Firebase版では一括初期化を無効にしています。')} // 認証完了後に描画
</script></body></html>
