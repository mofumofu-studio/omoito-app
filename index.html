er-radius:12px;padding:12px;background:white;color:#5c4540;margin:6px 0}textarea{min-height:76px}label{font-size:13px;color:#74594f;font-weight:600}.form{margin:12px 0;padding:14px;background:#fff2e9;border-radius:16px}.hidden{display:none!important}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #f0dcd3;display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.tabs-inner{display:flex;max-width:620px;width:100%}.tab{flex:1;border:0;background:transparent;color:#9b8179;font-size:11px;min-height:56px;padding:8px 1px}.tab span{display:block;font-size:23px;margin-bottom:2px}.tab.active{color:#c26c66;background:#fff0e9;border-radius:12px;font-weight:bold}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:space-between}.check{width:24px;height:24px;accent-color:#d77e77}.done{text-decoration:line-through;opacity:.55}.notice{background:#fff3d9;padding:10px;border-radius:12px;color:#846442;font-size:12px;line-height:1.6;margin:10px 0 18px}.footer{font-size:12px;color:#8b756c;text-align:center;margin:25px 0}.member-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.member-name{font-weight:700;overflow-wrap:anywhere}.person{display:inline-block;background:#fff0e6;padding:6px 10px;border-radius:999px;margin:3px;font-size:12px}.item>div:last-child{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}.remove{min-height:44px;padding:9px}.small{min-height:44px}.toast{position:fixed;bottom:calc(87px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 30px),550px);background:#65453d;color:#fff;box-shadow:0 5px 16px #65453d44;padding:12px 15px;border-radius:14px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px}.toast button{background:#fff;color:#704b43;border:0;border-radius:10px;padding:10px 12px;min-height:44px;font-weight:700}@media(max-width:375px){.brand img{width:58p </style></head><body><main><header><div class="brand"><img src="logo.jpg" alt="おもいと 正式ロゴ"><div><h1>おもいと</h1><small>家族の想いを、ひとつに。</small></div></div><span class="pill">☁️ Firebase版 0.8.0</span></header><div class="notice"><span id="syncStatus">接続準備中…</span> <button class="light small" id="logoutButton" style="display:none" onclick="logout()">ログアウト</button></div><div id="authPanel" class="card"><div class="title">🔐 家族アカウントでログイン</div><p class="muted">家族で共有するFirebase登録済みのメールアドレスとパスワードを入力してください。</p><form id="loginForm" onsubmit="login(event)"><label>メールアドレス</label><input type="email" name="email" autocomplete="username" required><label>パスワード</label><input type="password" name="password" autocomplete="current-password" required><button class="primary" type="submit">ログイン</button></form><p id="loginError" class="muted" role="alert"></p></div><div id="content" class="hidden"></div><p class="footer">🧵 おもいと｜家族の毎日を、ひとつに。</p></main><nav class="tabs hidden" id="navTabs" aria-label="主要メニュー"><div class="tabs-inner" id="tabs"></div></nav><div id="undoToast" class="toast hidden" role="status" aria-live="polite"><span>項目を削除しました</span><button onclick="undoDelete()">元に戻す</button></div>
<script>
// おもいと Firebase版: 同一の家族アカウントで認証し、家族用データを同期します。
const firebaseConfig={apiKey:'AIzaSyC1ZBUbhBf2iZM07_ZO98Bc_17J8bDhQEM',authDomain:'omoito-family.firebaseapp.com',projectId:'omoito-family',storageBucket:'omoito-family.firebasestorage.app',messagingSenderId:'826889232763',appId:'1:826889232763:web:fc9bfb'};
const FAMILY_ID='v8FnRoRPtcoowN5ZbtfS';
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const emptyState=()=>({events:[],shopping:[],tasks:[],notes:[],members:['大人A','大人B','子どもA','子どもB','子どもC'],memberColors:{}});
let state=emptyState(),docRef=null,unsubscribe=null,ready=false,writing=false;
function statusText(t){document.getElementById('syncStatus').textContent=t}
function normalizeState(raw){const base=emptyState();for(const k of ['events','shopping','tasks','notes','members'])if(Array.isArray(raw?.[k]))base[k]=raw[k];if(raw?.memberColors&&typeof raw.memberColors==='object'&&!Array.isArray(raw.memberColors)){for(const [name,color] of Object.entries(raw.memberColors)){if(typeof name==='string'&&name.length<=30&&COLOR_PALETTE.includes(color))base.memberColors[name]=color}}return base}
const COLOR_PALETTE=['#d77e77','#658dc9','#75a787','#d59a46','#aa84b9','#63a9af','#bd7e5b','#838da3','#d16d9c','#829553'];
function memberColor(name){if(name==='家族全員'||!name)return '#a18b80';const chosen=state.memberColors?.[name];if(COLOR_PALETTE.includes(chosen))return chosen;const index=state.members.indexOf(name);return COLOR_PALETTE[(index<0?0:index)%COLOR_PALETTE.length]}
function colorTag(name){return `<span class="person-dot" style="background:${memberColor(name)}" aria-hidden="true"></span>`}
let calendarFilter='家族全員';
function visibleEvent(item){return calendarFilter==='家族全員'||item.person===calendarFilter||item.person==='家族全員'}
function setCalendarFilter(value){if(value!=='家族全員'&&!state.members.includes(value))return;calendarFilter=value;render()}
function setMemberColor(index,value){if(!ready||!COLOR_PALETTE.includes(value))return;const name=state.members[index];if(!name)return;state.memberColors={...(state.memberColors||{}),[name]:value};save();render()}
function colorSelect(index,name){return `<label class="member-color-label">色 <select aria-label="${esc(name)}の表示色" onchange="setMemberColor(${index},this.value)">${COLOR_PALETTE.map((color,i)=>`<option value="${color}" ${memberColor(name)===color?'selected':''}>${['コーラル','ブルー','グリーン','オレンジ','パープル','水色','ブラウン','グレー','ピンク','オリーブ'][i]}</option>`).join('')}</select></label>`}
async function login(e){e.preventDefault();const fd=new FormData(e.target);document.getElementById('loginError').textContent='ログイン中…';try{await auth.signInWithEmailAndPassword(String(fd.get('email')).trim(),String(fd.get('password')));document.getElementById('loginError').textContent=''}catch(err){document.getElementById('loginError').textContent='ログインできませんでした。メール・パスワード・Firebaseの設定を確認してください。（'+err.code+'）'}}
async function logout(){if(unsubscribe){unsubscribe();unsubscribe=null}ready=false;docRef=null;await auth.signOut()}
auth.onAuthStateChanged(user=>{if(unsubscribe){unsubscribe();unsubscribe=null}ready=false;state=emptyState();document.getElementById('authPanel').classList.toggle('hidden',!!user);document.getElementById('content').classList.toggle('hidden',!user);document.getElementById('navTabs').classList.toggle('hidden',!user);document.getElementById('logoutButton').style.display=user?'inline-block':'none';if(!user){statusText('ログインしてください');document.getElementById('content').innerHTML='';return}statusText('☁️ 同期接続中…');docRef=db.collection('families').doc(FAMILY_ID).collection('appData').doc('main');unsubscribe=docRef.onSnapshot(snap=>{if(!snap.exists){state=emptyState();statusText('☁️ 接続済み（データ未登録）')}else{state=normalizeState(snap.data());if(calendarFilter!=='家族全員'&&!state.members.includes(calendarFilter))calendarFilter='家族全員';statusText('☁️ 同期済み')}ready=true;render()},err=>{ready=false;statusText('⚠️ 同期エラー：'+err.code);document.getElementById('content').innerHTML='<section class="card">Firestoreのルール・ログイン権限・ネットワークを確認してください。同期できない間は編集できません。</section>'})});
let tab='home',adding=false,editing=null,deletedItem=null;let calendarMonth=today().slice(0,7),selectedCalendarDate=today();const tabs=[['home','🏠','ホーム'],['events','📅','予定'],['shopping','🛒','買い物'],['tasks','✅','やること'],['notes','📝','メモ']];function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){if(!ready||!docRef){alert('同期接続を確認してください');return}statusText('☁️ 保存中…');docRef.set({...state,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).then(()=>statusText('☁️ 保存済み')).catch(err=>{ready=false;statusText('⚠️ 保存失敗：'+err.code);alert('クラウドに保存できませんでした。再読み込みして接続を確認してください。')})}function go(t){tab=t;adding=false;editing=null;document.getElementById('undoToast').classList.add('hidden');render()}function dateText(s){return s?new Date(s+'T00:00:00').toLocaleDateString('ja-JP',{month:'short',day:'numeric',weekday:'short'}):''}function dateKey(y,m,d){return [y,String(m).padStart(2,'0'),String(d).padStart(2,'0')].join('-')}
function moveCalendarMonth(step){const [year,month]=calendarMonth.split('-').map(Number);const next=new Date(year,month-1+step,1);calendarMonth=dateKey(next.getFullYear(),next.getMonth()+1,1).slice(0,7);selectedCalendarDate=calendarMonth+'-01';render()}
function calendarToday(){selectedCalendarDate=today();calendarMonth=selectedCalendarDate.slice(0,7);render()}
function selectCalendarDay(date){selectedCalendarDate=date;calendarMonth=date.slice(0,7);render()}
function calendarHTML(){const [year,month]=calendarMonth.split('-').map(Number);const start=new Date(year,month-1,1).getDay(),days=new Date(year,month,0).getDate();const eventMap=new Map();for(const item of state.events){if(typeof item.date!=='string'||!visibleEvent(item))continue;const entries=eventMap.get(item.date)||[];entries.push(item);eventMap.set(item.date,entries)}const week=['日','月','火','水','木','金','土'];let cells=week.map(d=>`<div class="calendar-week">${d}</div>`).join('');for(let i=0;i<Math.ceil((start+days)/7)*7;i++){const n=i-start+1;if(n<1||n>days){cells+='<div aria-hidden="true"></div>';continue}const date=dateKey(year,month,n),dayEvents=eventMap.get(date)||[],count=dayEvents.length,classes=[date===today()?'today':'',date===selectedCalendarDate?'selected':''].filter(Boolean).join(' ');cells+=`<button type="button" class="calendar-day ${classes}" aria-label="${month}月${n}日 ${count}件の予定" aria-pressed="${date===selectedCalendarDate}" onclick="selectCalendarDay('${date}')"><span class="calendar-num">${n}</span>${count?`<span class="calendar-dots">${[...new Set(dayEvents.map(e=>memberColor(e.person)))].slice(0,4).map(color=>`<i style="background:${color}"></i>`).join('')}</span><span class="calendar-count">${count}件</span>`:''}</button>`}const items=state.events.filter(x=>x.date===selectedCalendarDate&&visibleEvent(x)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));return `<section class="card"><div class="calendar-head"><strong>📅 ${year}年${month}月</strong><div class="calendar-nav"><button class="light small" onclick="moveCalendarMonth(-1)" aria-label="前の月">‹</button><button class="light small" onclick="calendarToday()">今日</button><button class="light small" onclick="moveCalendarMonth(1)" aria-label="次の月">›</button></div></div><div class="calendar-filter"><label for="calendarPersonFilter">👨‍👩‍👧‍👦 表示する家族</label><select id="calendarPersonFilter" onchange="setCalendarFilter(this.value)"><option value="家族全員" ${calendarFilter==='家族全員'?'selected':''}>全員の予定</option>${state.members.map(n=>`<option value="${esc(n)}" ${calendarFilter===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="calendar-legend">${state.members.map(n=>`<span>${colorTag(n)}${esc(n)}</span>`).join('')}<span>${colorTag('家族全員')}家族全員</span></div><div class="calendar-grid">${cells}</div><div class="calendar-agenda"><h3>📌 ${esc(dateText(selectedCalendarDate))}の予定（${items.length}件）</h3>${items.length?items.map(x=>`<div class="item"><div style="min-width:0;flex:1"><strong>${colorTag(x.person)}${esc(x.title)}</strong><div class="sub">${esc(x.person||'家族全員')} · ${esc(x.time||'終日')}</div></div><button class="light small" onclick="editCalendarItem('${String(x.id).replace(/[^0-9a-zA-Z_-]/g,'')}')">編集</button></div>`).join(''):'<p class="muted">この日の予定はありません</p>'}<button class="light calendar-action" onclick="addCalendarEvent()">＋ この日に予定を追加</button></div></section>`}
function addCalendarEvent(){tab='events';editing=null;adding=true;render();document.querySelector('.form')?.scrollIntoView({behavior:'smooth',block:'start'})}
function editCalendarItem(id){const item=state.events.find(x=>String(x.id)===String(id));if(!item)return;tab='events';editing=item.id;adding=true;render();document.querySelector('.form')?.scrollIntoView({behavior:'smooth',block:'start'})}
function render(){document.getElementById('tabs').innerHTML=tabs.map(([id,ic,lb])=>`<button class="tab ${tab===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${lb}</button>`).join('');let html='';if(tab==='home'){let ev=state.events.filter(x=>x.date===today()).sort((a,b)=>(a.time||'').localeCompare(b.time||''));html=`<section class="card hello"><div class="title">おかえりなさい！ 🌸</div><div>今日も家族の予定をチェックしよう</div></section><section class="card"><div class="row"><strong>📅 今日の予定</strong><button class="remove" onclick="go('events')">すべて見る ›</button></div>${ev.length?ev.slice(0,3).map(x=>`<div class="item"><span>${colorTag(x.person)}${esc(x.title)}<div class="sub">${esc(x.person)}</div></span><b>${esc(x.time||'終日')}</b></div>`).join(''):'<p class="muted">今日の予定はありません</p>'}</section><div class="two"><button class="tile" onclick="go('shopping')">🛒<br><strong>買い物</strong><div class="sub">残り${state.shopping.filter(x=>!x.done).length}件</div></button><button class="tile" onclick="go('tasks')">✅<br><strong>やること</strong><div class="sub">残り${state.tasks.filter(x=>!x.done).length}件</div></button></div><section class="card" style="margin-top:14px"><div class="row"><strong>📌 大切なメモ</strong><button class="remove" onclick="go('notes')">メモへ ›</button></div>${state.notes.filter(x=>x.pinned).map(x=>`<p>${esc(x.title)}</p>`).join('')||'<p class="muted">固定メモはありません</p>'}</section><button class="light" onclick="go('settings')">⚙️ 家族・設定</button>`}else if(tab==='settings'){html=`<div class="title">⚙️ 家族・設定</div><section class="card"><div class="row"><strong>👨‍👩‍👧‍👦 家族メンバー</strong><span class="muted">${state.members.length}人</span></div><p class="muted">家族ごとの色を選べます。名前と色は全員に同期され、予定カレンダーにも反映されます。</p><form class="form" onsubmit="addMember(event)"><label for="memberName">新しいメンバーの名前</label><input id="memberName" name="memberName" maxlength="30" required placeholder="例：お父さん"><button class="primary" type="submit">＋ メンバーを追加</button></form>${state.members.map((x,i)=>`<div class="item"><span class="member-name">${colorTag(x)}👤 ${esc(x)}</span><div class="member-actions">${colorSelect(i,x)}<button class="light small" onclick="renameMember(${i})">名前変更</button><button class="remove" onclick="removeMember(${i})">削除</button></div></div>`).join('')}<p class="muted">※ ここでのメンバー設定は表示名の管理です。ログインアカウントや個別の閲覧権限は作りません。</p></section><section class="card"><strong>💾 バックアップ・復元</strong><p class="muted">家族の予定・買い物・やること・メモ・メンバー名・色設定をJSONファイルに保存できます。ファイルには家族の情報が入るため、共有や保管に注意してください。</p><div class="row"><button class="primary" onclick="downloadBackup()">⬇️ バックアップを保存</button><span class="muted">通信中は操作できません</span></div><div class="form"><strong>📂 バックアップから復元</strong><p class="muted">復元すると現在の家族全員のデータが置き換わります。先に必ず最新のバックアップを保存してください。</p><label for="backupFile">バックアップファイル（.json）</label><input id="backupFile" type="file" accept=".json,application/json" onchange="readBackupFile(event)"><div id="restorePreview" class="muted" role="status">ファイルを選ぶと内容を確認できます。</div><label style="display:flex;align-items:center;gap:8px;margin-top:12px"><input id="restoreSafety" type="checkbox" style="width:auto" onchange="updateRestoreButton()">最新データのバックアップを保存済みです</label><button id="restoreButton" class="light" type="button" onclick="restoreBackup()" disabled>復元する（現在の共有データを置換）</button></div></section><section class="card"><strong>共有データの保護</strong><p class="muted">共有データの一括削除は安全のため無効です。</p><button class="light" onclick="reset()">初期化は無効</button></section><button class="light" onclick="go('home')">← ホームに戻る</button>`}else{const labels={events:'📅 家族の予定',shopping:'🛒 買い物リスト',tasks:'✅ やること',notes:'📝 家族メモ'};html=`<div class="row"><div class="title">${labels[tab]}</div><button class="primary" onclick="startAdd()">＋ 追加</button></div>${adding?formHTML():''}${tab==='events'?calendarHTML()+'<div class="calendar-list-label"><strong>📋 予定の一覧</strong><span class="muted">すべての予定</span></div>':''}<section class="card">${listHTML()}</section>`}document.getElementById('content').innerHTML=html}function startAdd(){editing=null;adding=!adding;render()}function formHTML(){let data=editing!=null?(state[tab].find(x=>x.id===editing)||{}):{},item=`<label>${tab==='events'?'予定名':tab==='shopping'?'商品名':tab==='tasks'?'やること':'メモ内容'}</label><input name="title" required maxlength="120" value="${esc(data.title||'')}" placeholder="入力してください">`;if(tab==='events')item+=`<label>日付</label><input name="date" type="date" required value="${esc(data.date||(tab==='events'?selectedCalendarDate:today()))}"><label>時間（空欄なら終日）</label><input name="time" type="time" value="${esc(data.time||'')}"><label>対象者</label>${personSelect(data.person)}`;if(tab==='shopping')item+=`<label>数量</label><input name="qty" maxlength="30" value="${esc(data.qty||'')}" placeholder="例：1個">`;if(tab==='tasks')item+=`<label>期限</label><input name="date" type="date" value="${esc(data.date||today())}"><label>担当者</label>${personSelect(data.person)}`;if(tab==='notes')item+=`<label><input style="width:auto" type="checkbox" name="pinned" ${data.pinned?'checked':''}> ホームに固定する</label>`;return `<form class="form" onsubmit="submitItem(event)">${item}<div class="row"><button class="primary" type="submit">${editing!=null?'変更を保存':'追加する'}</button><button class="light" type="button" onclick="cancelForm()">キャンセル</button></div></form>`}function personSelect(v){return `<select name="person"><option value="家族全員" ${v==='家族全員'?'selected':''}>家族全員</option>${state.members.map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`}function listHTML(){let items=[...state[tab]];if(tab==='events')items.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));if(tab==='notes')items.sort((a,b)=>Number(b.pinned)-Number(a.pinned));if(!items.length)return '<p class="muted">まだ登録がありません。「追加」から登録してね。</p>';return items.map(x=>`<div class="item"><div style="flex:1;min-width:0">${['shopping','tasks'].includes(tab)?`<label style="display:flex;align-items:center;gap:10px"><input class="check" style="width:24px;margin:0" type="checkbox" ${x.done?'checked':''} onchange="toggle(${x.id})"><span class="${x.done?'done':''}">${esc(x.title)}</span></label>`:`<strong>${tab==='events'?colorTag(x.person):''}${tab==='notes'&&x.pinned?'📌 ':''}${esc(x.title)}</strong>`}<div class="sub">${tab==='events'?`${dateText(x.date)} ${esc(x.time||'終日')} · ${esc(x.person)}`:tab==='tasks'?`${dateText(x.date)} · ${esc(x.person)}`:tab==='shopping'?esc(x.qty||'数量未設定'):'家族メモ'}</div></div><div><button class="light small" onclick="editItem(${x.id})">編集</button> <button class="remove" onclick="deleteItem(${x.id})">削除</button></div></div>`).join('')}function submitItem(e){e.preventDefault();if(!ready){alert("クラウド同期が接続されていません");return}const fd=new FormData(e.target),title=String(fd.get('title')||'').trim();if(!title){alert('内容を入力してね');return}let obj={title};if(tab==='events')Object.assign(obj,{date:fd.get('date'),time:fd.get('time'),person:fd.get('person')});if(tab==='shopping')obj.qty=String(fd.get('qty')||'');if(tab==='tasks')Object.assign(obj,{date:fd.get('date'),person:fd.get('person')});if(tab==='notes')obj.pinned=fd.get('pinned')==='on';if(editing!=null){let old=state[tab].find(x=>x.id===editing);Object.assign(old,obj)}else state[tab].push({id:Date.now(),done:false,...obj});save();adding=false;editing=null;render()}function toggle(id){if(!ready)return;let item=state[tab].find(x=>x.id===id);if(item){item.done=!item.done;save();render()}}function editItem(id){editing=id;adding=true;render();document.querySelector('.form')?.scrollIntoView({behavior:'smooth',block:'start'})}function cancelForm(){adding=false;editing=null;render()}function deleteItem(id){if(!ready)return;if(!confirm('この項目を削除しますか？'))return;const removed=state[tab].find(x=>x.id===id);if(!removed)return;deletedItem={tab,item:{...removed}};state[tab]=state[tab].filter(x=>x.id!==id);save();render();document.getElementById('undoToast').classList.remove('hidden')}function undoDelete(){if(!ready)return;if(!deletedItem)return;const {tab:target,item}=deletedItem;if(!state[target].some(x=>x.id===item.id)){state[target].push(item);save()}deletedItem=null;document.getElementById('undoToast').classList.add('hidden');render()}function cleanMemberName(value){return String(value??'').trim().replace(/\s+/g,' ').slice(0,30)}
function addMember(e){e.preventDefault();if(!ready){alert('クラウド同期に接続されていません');return}const inp=e.target.elements.memberName;const name=cleanMemberName(inp.value);if(!name){alert('名前を入力してね');return}if(name==='家族全員'||state.members.includes(name)){alert('その名前はすでに使われています');return}if(state.members.length>=30){alert('メンバーは30人まで登録できます');return}state.members.push(name);save();render()}
function renameMember(index){if(!ready)return;const old=state.members[index];if(typeof old!=='string')return;const entered=prompt('新しい名前を入力してください',old);if(entered===null)return;const name=cleanMemberName(entered);if(!name){alert('名前を入力してね');return}if(name==='家族全員'||state.members.some((x,i)=>i!==index&&x===name)){alert('その名前はすでに使われています');return}if(name===old)return;state.members[index]=name;if(state.memberColors&&Object.prototype.hasOwnProperty.call(state.memberColors,old)){state.memberColors[name]=state.memberColors[old];delete state.memberColors[old]}if(calendarFilter===old)calendarFilter=name;for(const kind of ['events','tasks'])for(const item of state[kind])if(item.person===old)item.person=name;save();render()}
function removeMember(index){if(!ready)return;const name=state.members[index];if(typeof name!=='string')return;if(state.members.length<=1){alert('最後の1人は削除できません');return}const used=state.events.filter(x=>x.person===name).length+state.tasks.filter(x=>x.person===name).length;const message='「'+name+'」をメンバー一覧から削除しますか？'+(used?'\n関連する予定・やること '+used+' 件の対象者を「家族全員」に変更します。予定やタスク自体は削除しません。':'');if(!confirm(message))return;state.members.splice(index,1);delete state.memberColors[name];if(calendarFilter===name)calendarFilter='家族全員';for(const kind of ['events','tasks'])for(const item of state[kind])if(item.person===name)item.person='家族全員';save();render()}
// バックアップ・復元：読み込み済みデータはサーバーから最新を再取得する
let restoreCandidate=null,restoreBusy=false;
const dataKeys=['events','shopping','tasks','notes','members'];
function backupCounts(data){return '予定 '+data.events.length+'件・買い物 '+data.shopping.length+'件・やること '+data.tasks.length+'件・メモ '+data.notes.length+'件・メンバー '+data.members.length+'人'}
function resetRestoreForm(){restoreCandidate=null;const f=document.getElementById('backupFile');if(f)f.value='';const c=document.getElementById('restoreSafety');if(c)c.checked=false;const p=document.getElementById('restorePreview');if(p)p.textContent='ファイルを選ぶと内容を確認できます。';updateRestoreButton()}
function updateRestoreButton(){const b=document.getElementById('restoreButton'),c=document.getElementById('restoreSafety');if(b)b.disabled=!ready||restoreBusy||!restoreCandidate||!c?.checked}
async function getFreshData(){if(!ready||!docRef||!auth.currentUser)throw Error('ログイン・同期接続を確認してください');const snap=await docRef.get({source:'server'});if(!snap.exists) return emptyState();return normalizeState(snap.data())}
function offerJson(data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='omoito_backup_'+new Date().toLocaleDateString('sv-SE')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function downloadBackup(){if(restoreBusy)return;try{const current=await getFreshData();const backup={format:'omoito-family-backup',version:1,exportedAt:new Date().toISOString(),familyId:FAMILY_ID,data:{...Object.fromEntries(dataKeys.map(k=>[k,current[k]])),memberColors:current.memberColors||{}}};offerJson(backup);alert('バックアップファイルを保存しました。iPhoneの「ファイル」アプリで保存先とファイルを確認してください。')}catch(e){alert('バックアップできませんでした。ネットワークと同期状態を確認してください。\n'+e.message)}}
function validateBackup(payload){if(!payload||payload.format!=='omoito-family-backup'||payload.version!==1||payload.familyId!==FAMILY_ID)throw Error('おもいとのこの家族用のバックアップではありません');const d=payload.data;if(!d||typeof d!=='object'||Array.isArray(d))throw Error('データ形式が不正です');for(const k of dataKeys)if(!Array.isArray(d[k]))throw Error(k+'のデータがありません');if(d.members.length<1||d.members.length>30||d.members.some(x=>typeof x!=='string'||!x.trim()||x.length>30)||new Set(d.members).size!==d.members.length)throw Error('メンバー情報が不正です');for(const k of dataKeys.slice(0,4)){if(d[k].length>10000)throw Error('件数が多すぎます');const ids=new Set();for(const x of d[k]){if(!x||typeof x!=='object'||Array.isArray(x)||!['string','number'].includes(typeof x.id)||typeof x.title!=='string'||!x.title.trim()||x.title.length>120)throw Error(k+'に不正な項目があります');if(ids.has(String(x.id)))throw Error(k+'に重複したIDがあります');ids.add(String(x.id));for(const [key,value] of Object.entries(x)){if(key==='id'||key==='title')continue;if(!['string','number','boolean'].includes(typeof value)||typeof value==='string'&&value.length>1000)throw Error(k+'の値が不正です')}}}const restored=Object.fromEntries(dataKeys.map(k=>[k,JSON.parse(JSON.stringify(d[k]))]));restored.memberColors={};if(d.memberColors!==undefined){if(!d.memberColors||typeof d.memberColors!=='object'||Array.isArray(d.memberColors))throw Error('色設定が不正です');for(const [name,color] of Object.entries(d.memberColors)){if(!d.members.includes(name)||!COLOR_PALETTE.includes(color))throw Error('色設定が不正です');restored.memberColors[name]=color}}return restored}
async function readBackupFile(e){restoreCandidate=null;updateRestoreButton();const file=e.target.files?.[0],preview=document.getElementById('restorePreview');if(!file){preview.textContent='ファイルが選ばれていません';return}try{if(file.size>2*1024*1024)throw Error('2MB以下のバックアップを選んでください');const parsed=JSON.parse(await file.text());restoreCandidate=validateBackup(parsed);preview.textContent='復元予定：'+backupCounts(restoreCandidate)+'。保存日時：'+(parsed.exportedAt?new Date(parsed.exportedAt).toLocaleString('ja-JP'):'不明')+'。現在のデータは復元時に置き換わります。';updateRestoreButton()}catch(err){restoreCandidate=null;preview.textContent='読み込み不可：'+err.message;updateRestoreButton()}}
async function restoreBackup(){if(restoreBusy||!restoreCandidate||!ready||!document.getElementById('restoreSafety')?.checked)return;const candidate=restoreCandidate;const answer=prompt('復元すると家族全員の現在のデータが置き換わります。\n'+backupCounts(candidate)+'\n実行する場合は「復元」と入力してください');if(answer!=='復元')return;if(!confirm('最終確認：現在の共有データをバックアップファイルの内容に置き換えます。よろしいですか？'))return;restoreBusy=true;updateRestoreButton();try{await getFreshData();await docRef.set({...candidate,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});statusText('☁️ 復元完了・同期中…');resetRestoreForm();alert('復元を書き込みました。家族の端末にも同期されます。')}catch(e){alert('復元に失敗しました。最新状態を確認してください。\n'+e.message)}finally{restoreBusy=false;updateRestoreButton()}}
function reset(){alert('共有データを誤って削除しないよう、Firebase版では一括初期化を無効にしています。')} // 認証完了後に描画
</script></body></html>
